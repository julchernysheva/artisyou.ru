<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="application-name" content="Карта исследовательских связей">
<meta name="version" content="RUSSIAN INTELLECT V18.1 RC1">
<meta name="freeze-date" content="2026-08-20">
<title>Карта исследовательских связей</title>
<link rel="stylesheet" href="/assets/art-is-you/font-contract.css">
<link rel="stylesheet" href="/assets/art-is-you/design-tokens.css">
<style>
:root{
 --paper:var(--surface);--paper2:var(--surface);--warm:var(--muted);
 --line:var(--rule);--line2:var(--rule);
 --blue:var(--ui-accent);--orange:var(--muted);--white:var(--surface);--black:var(--ink);
 --sans:"Source Sans 3",sans-serif;--mono:"PT Mono",monospace;
}
*{box-sizing:border-box}html,body{font-synthesis:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr 26px;min-width:980px}
.top{border-bottom:1px solid var(--line);background:var(--paper);z-index:10}
.primary{height:48px;display:flex;align-items:center;padding:0 28px;gap:28px}
.brand{font:500 11px/1 var(--mono);letter-spacing:.07em;color:var(--ink);white-space:nowrap}
.nav{display:flex;gap:22px;align-items:center}
.nav button,.subnav button,.thirdnav button{appearance:none;border:0;border-bottom:1px solid transparent;background:none;color:var(--warm);cursor:pointer}
.nav button{padding:5px 0;font:500 10px/1 var(--mono);letter-spacing:.08em}
.nav button.active,.subnav button.active,.thirdnav button.active{color:var(--blue);border-color:var(--blue)}
.runtime-badge{margin-left:auto;font:500 9px/1 var(--mono);letter-spacing:.06em;color:var(--warm)}
.runtime-badge.pass{color:var(--warm)} .runtime-badge.fail{color:var(--orange)}
.subnav-wrap{display:none;border-top:1px solid var(--line2);padding:6px 28px 5px;min-height:28px}
.subnav-wrap.open{display:block}
.subnav{display:flex;align-items:center;gap:8px 15px;flex-wrap:wrap}
.subnav button{padding:2px 0;font:500 8.5px/1.2 var(--mono);letter-spacing:.055em}
.thirdnav-wrap{display:none;border-top:1px solid var(--line2);padding:5px 28px 6px;min-height:27px}
.thirdnav-wrap.open{display:block}
.thirdnav{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.thirdnav button{padding:2px 0;font:500 8px/1.2 var(--mono);letter-spacing:.04em}
.stage{position:relative;min-height:0;overflow:hidden}
svg{width:100%;height:100%;display:block}
.grid{stroke:var(--line);stroke-width:.65;vector-effect:non-scaling-stroke}
.hist-edge{fill:none;stroke:var(--warm);stroke-opacity:.20;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;transition:.15s opacity,.15s stroke-opacity,.15s stroke-width}
.hist-edge.INFLUENCE{stroke-dasharray:5 5;stroke-width:1}
.hist-edge.TEACHING{stroke-width:1.15}
.hist-edge.SCHOOL_CONTINUITY{stroke-width:1.0}
.hist-edge.COLLABORATION{stroke-width:.85;stroke-opacity:.16}
.hist-edge.route-active{stroke:var(--orange);stroke-opacity:.96;stroke-width:1.85}
.hist-edge.dim{opacity:.08}
.hist-node{cursor:pointer;transition:.15s opacity}
.hist-node .dot{fill:var(--paper);stroke:var(--black);stroke-width:1.15;vector-effect:non-scaling-stroke}
.hist-node.major .dot{fill:var(--black)}
.hist-node.modern-person .dot{stroke:var(--warm);stroke-width:1.35}
.label-plate{fill:var(--paper);stroke:var(--line);stroke-width:.75;vector-effect:non-scaling-stroke}
.hist-node .surname{font:500 11.7px var(--sans);fill:var(--ink);letter-spacing:.004em}
.hist-node.major .surname{font-size:15.2px;font-weight:500}
.hist-node .years{font:400 7.4px var(--mono);fill:var(--warm);letter-spacing:.025em}
.hist-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .label-plate{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .surname,.hist-node.selected .years{fill:var(--white)}
.hist-node.dim{opacity:.10}
.hist-node.context{opacity:.48}
.modern-edge{fill:none;stroke:var(--orange);stroke-width:1.18;stroke-opacity:.34;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;transition:.15s opacity,.15s stroke-width,.15s stroke-opacity}
.modern-edge.strength-B{stroke-dasharray:7 5;stroke-opacity:.25}
.modern-edge.dim{opacity:.06}
.modern-edge.active{stroke-width:2.15;stroke-opacity:1}
.modern-node{cursor:pointer;transition:.15s opacity}
.modern-node .dot{fill:var(--paper);stroke:var(--orange);stroke-width:1.55;vector-effect:non-scaling-stroke}
.modern-node.external .dot{stroke:var(--warm);stroke-width:1.3}
.modern-node.company .dot{fill:var(--orange);stroke:var(--orange)}
.modern-node .mplate{fill:var(--paper);stroke:var(--line);stroke-width:.75;vector-effect:non-scaling-stroke}
.modern-node .mname{font:500 10.8px var(--sans);fill:var(--ink)}
.modern-node .mtype{font:500 6.3px var(--mono);fill:var(--orange);letter-spacing:.06em}
.modern-node.external .mname{font-size:9px;font-weight:500;fill:var(--warm)}
.modern-node.external .mtype{fill:var(--warm)}
.modern-node.company .mname{font-size:12.8px;font-weight:500}
.modern-node.company .mtype{fill:var(--warm)}
.modern-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mname,.modern-node.selected .mtype{fill:var(--white)}
.modern-node.dim{opacity:.10}
.modern-node.context{opacity:.48}
.modern-node:hover .mplate{stroke:var(--blue);stroke-width:1.8}
.drawer{
 position:absolute;left:50%;top:50%;transform:translate(-28%,-50%);
 width:430px;max-height:76%;overflow:auto;
 background:var(--paper);
 border:1px solid var(--line);border-top:3px solid var(--orange);
 padding:23px 22px 25px;display:none;z-index:20;
 box-shadow:none
}
.drawer.open{display:block}
.drawer.pos-left{left:37%;transform:translate(-50%,-50%)}
.drawer.pos-right{left:62%;transform:translate(-50%,-50%)}
.drawer.company-safe{
 left:18px;top:18px;bottom:18px;transform:none;
 width:398px;max-height:none;height:auto;overflow:auto
}
#map{transition:width .18s ease,margin-left .18s ease}
.stage.company-card-open #map{
 width:calc(100% - 432px);margin-left:432px
}

.drawer button.close{position:absolute;right:14px;top:12px;border:0;background:none;font:400 22px/1 var(--sans);color:var(--warm);cursor:pointer}
.drawer .selected-badge{display:inline-block;background:var(--blue);color:var(--white);padding:5px 8px;margin:0 0 10px;font:500 7px/1 var(--mono);letter-spacing:.06em}
.drawer .eyebrow{font:500 8px/1.2 var(--mono);letter-spacing:.08em;color:var(--orange);margin:0 34px 8px 0;text-transform:uppercase}
.drawer h2{margin:0 34px 6px 0;font-size:25px;font-weight:500;line-height:1.06;letter-spacing:-.012em}
.drawer .meta{font:400 9px/1.4 var(--mono);color:var(--warm);margin-bottom:18px;letter-spacing:.02em}
.drawer .section{border-top:1px solid var(--line2);padding-top:10px;margin-top:12px}
.drawer .key{font:500 7px/1.2 var(--mono);letter-spacing:.07em;color:var(--warm);margin-bottom:6px;text-transform:uppercase}
.drawer .value{font-size:12.5px;line-height:1.45}
.drawer .lead{font-size:14px;line-height:1.48}
.drawer .tags{display:flex;gap:5px;flex-wrap:wrap}
.drawer .tag{border:1px solid var(--line);padding:3px 6px;font:500 7px/1.1 var(--mono);letter-spacing:.03em}
.drawer .relation{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:11.5px;line-height:1.3}
.drawer .relation-type{font:500 7px/1.2 var(--mono);letter-spacing:.04em;color:var(--warm);text-align:right}
.drawer .route{padding:7px 0;border-top:1px solid var(--line2);font:500 9.5px/1.42 var(--mono)}
.drawer .evidence{display:inline-block;border:1px solid var(--orange);padding:3px 6px;margin-right:5px;font:500 7px/1 var(--mono);letter-spacing:.055em;color:var(--orange)}
.drawer .source{display:block;padding:5px 0;border-top:1px solid var(--line2);font:500 8px/1.35 var(--mono);color:var(--warm);text-decoration:none}
.drawer .source:hover{color:var(--blue)}
.drawer .empty{color:var(--warm)}
.footer{border-top:1px solid var(--line2);display:flex;align-items:center;padding:0 18px;gap:14px;font:500 7px/1 var(--mono);letter-spacing:.045em;color:var(--warm)}
.footer strong{color:var(--ink);font-weight:500}
.footer .spacer{margin-left:auto}
.error{position:absolute;inset:18px;background:var(--paper);border:1px solid var(--orange);padding:20px;z-index:50;font:12px/1.5 var(--mono);display:none;white-space:pre-wrap}
.error.open{display:block}

/* Research interaction grammar: active routes use ink + stroke + label; blue remains focus/UI. */
.hist-edge.route-active,.modern-edge.active{stroke:var(--ink)!important;stroke-width:1.5!important;stroke-opacity:.94!important}
.hist-edge.hover-active,.modern-edge.hover-active{stroke:var(--ink)!important;stroke-width:1.3!important;stroke-opacity:.82!important}
.edge-label-group.active .edge-label-bg,.edge-label-group.hover-active .edge-label-bg{stroke:var(--ink)!important;stroke-width:1.3!important}
.edge-label-group.active .edge-label-text,.edge-label-group.hover-active .edge-label-text{fill:var(--ink)!important}
.hist-node.hover-focus:not(.selected) .dot,.modern-node.hover-route:not(.selected) .dot,.modern-node.company-hover-focus:not(.selected) .dot{stroke:var(--ink)!important;stroke-width:1.3!important}
.hist-node.hover-focus:not(.selected) .label-plate,.modern-node.hover-route:not(.selected) .mplate,.modern-node.company-hover-focus:not(.selected) .mplate{stroke:var(--ink)!important;stroke-width:1.3!important}
.hist-node.selected .dot,.modern-node.selected .dot{fill:var(--paper)!important;stroke:var(--ink)!important;stroke-width:1.55!important}
.hist-node.selected .label-plate,.modern-node.selected .mplate{fill:var(--paper)!important;stroke:var(--ink)!important;stroke-width:1.3!important}
.hist-node.selected .surname,.hist-node.selected .years,.modern-node.selected .mname,.modern-node.selected .mtype,.modern-node.selected .mstats{fill:var(--ink)!important}
.hist-node:focus-visible .dot,.modern-node:focus-visible .dot{stroke:var(--blue)!important;stroke-width:1.55!important}
.hist-node:focus-visible .label-plate,.modern-node:focus-visible .mplate{stroke:var(--blue)!important;stroke-width:1.3!important}
.drawer,.entity-search-results{box-shadow:none}

/* V17.6 — VISUAL HIERARCHY / LABELS */
.hist-node.tier-primary .dot{fill:var(--ink);stroke:var(--ink);stroke-width:1.35}
.hist-node.tier-primary .surname{font-size:18.2px;font-weight:500;letter-spacing:.015em}
.hist-node.tier-primary .years{font-size:9.4px}
.hist-node.tier-connected{opacity:.92}
.hist-node.tier-connected .dot{stroke-width:1.25}
.hist-node.tier-connected .surname{font-size:13px;font-weight:500}
.hist-node.tier-connected .years{font-size:7.8px}
.hist-node.tier-context{opacity:.68}
.hist-node.tier-context .dot{stroke-opacity:.72}
.hist-node.tier-context .surname{font-size:10.2px;font-weight:500}
.hist-node.tier-context .years{font-size:6.8px}
.hist-node.selected{opacity:1}
.hist-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .label-plate{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .surname,.hist-node.selected .years{fill:var(--white)}

.modern-node.tier-primary.company .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.7}
.modern-node.tier-primary.company .mname{font-size:18.6px;font-weight:500;letter-spacing:.02em}
.modern-node.tier-primary.company .mtype{font-size:7.2px}
.modern-node.tier-primary.company .mstats{font:500 6.1px/1 var(--mono);letter-spacing:.05em;fill:var(--warm);text-transform:uppercase}
.modern-node.tier-context{opacity:.72}
.modern-node.tier-context.technology .dot{fill:var(--paper);stroke:var(--orange);stroke-width:1.25}
.modern-node.tier-context.technology .mplate{stroke:var(--line)}
.modern-node.tier-context.technology .mname{font-size:10px;font-weight:500}
.modern-node.tier-context.technology .mtype{font-size:5.8px}
.modern-node.tier-context.external .dot{fill:var(--paper);stroke:var(--warm);stroke-width:1.1}
.modern-node.tier-context.external .mname{font-size:8.8px;font-weight:500}
.modern-node.tier-context.external .mtype{font-size:5.4px}
.modern-node.tier-context.middle-context .dot{fill:var(--paper);stroke:var(--warm);stroke-width:1.05}
.modern-node.tier-context.middle-context .mname{font-size:9px;font-weight:500}
.modern-node.tier-context.middle-context .mtype{font-size:5.4px}
.modern-node.selected{opacity:1}
.modern-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mname,.modern-node.selected .mtype{fill:var(--white)}

.edge-label-group{pointer-events:none;opacity:0;transition:opacity .14s ease}
.edge-label-group.prominent{opacity:.36}
.edge-label-group.endpoint-label{opacity:.28}
.edge-label-group.hovered{opacity:.88}
.edge-label-group.active{opacity:1}
.edge-label-group.dim{opacity:.035}
.edge-label-bg{fill:var(--paper);stroke:var(--line2);stroke-width:.55;vector-effect:non-scaling-stroke}
.edge-label-text{font:500 5.5px/1 var(--mono);letter-spacing:.055em;fill:var(--warm);text-transform:uppercase}
.edge-label-group.active .edge-label-bg{stroke:var(--blue)}
.edge-label-group.active .edge-label-text{fill:var(--orange)}
.hist-edge,.modern-edge{pointer-events:none;cursor:default}

/* One keyboard- and pointer-operable SVG group owns each entity.  The
   transparent mark enlarges only its hit target; it never changes the
   evidence marker or label geometry. */
.node-hit-area{fill:transparent;stroke:transparent;pointer-events:all}
.hist-node,.modern-node{pointer-events:all}
.hist-node:focus-visible,.modern-node:focus-visible{outline:none}


/* V17.6.4 — EDGE GEOMETRY NORMALIZATION */

/* COMPANY PRIMARY > MODERN PRIMARY > HISTORICAL PRIMARY > CONNECTED > CONTEXT */
.hist-node.tier-primary .surname{font-size:15.8px;font-weight:500;letter-spacing:.008em}
.hist-node.tier-primary .years{font-size:8.7px}

.hist-node.tier-modern-primary{opacity:1}
.hist-node.tier-modern-primary .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.6}
.hist-node.tier-modern-primary .label-plate{fill:var(--paper);stroke:var(--orange);stroke-width:.9}
.hist-node.tier-modern-primary .surname{font-size:17.2px;font-weight:500;letter-spacing:.012em;fill:var(--ink)}
.hist-node.tier-modern-primary .years{font-size:8.8px;fill:var(--warm)}

.modern-node.tier-primary.company .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.8}
.modern-node.tier-primary.company .mplate{fill:var(--orange);stroke:var(--orange);stroke-width:.9}
.modern-node.tier-primary.company .mname{font-size:20.4px;font-weight:500;letter-spacing:.022em;fill:var(--white)}
.modern-node.tier-primary.company .mtype{font-size:7.6px;fill:var(--white)}
.modern-node.tier-primary.company .mstats{
 font:500 6.5px/1 var(--mono);
 letter-spacing:.05em;
 fill:var(--paper);
 text-transform:uppercase
}

/* Selected state overrides orange without changing dimensions. */
.hist-node.tier-modern-primary.selected .dot,
.modern-node.tier-primary.company.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.tier-modern-primary.selected .label-plate,
.modern-node.tier-primary.company.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.hist-node.tier-modern-primary.selected .surname,
.hist-node.tier-modern-primary.selected .years,
.modern-node.tier-primary.company.selected .mname,
.modern-node.tier-primary.company.selected .mtype,
.modern-node.tier-primary.company.selected .mstats{fill:var(--white)}


/* V17.7 — CARDS + SEARCH */
.entity-search{position:relative;margin-left:auto;width:min(360px,28vw);z-index:40}
.search-field{height:34px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);color:var(--warm)}
.search-icon{font:500 17px/1 var(--sans);transform:translateY(-1px)}
.search-field input{appearance:none;border:0;outline:0;background:transparent;width:100%;padding:7px 0;color:var(--ink);font:500 10px/1.2 var(--mono);letter-spacing:.055em}
.search-field input::placeholder{color:var(--warm)}
.search-field:focus-within{border-color:var(--blue)}
.entity-search-results{position:absolute;top:38px;right:0;width:min(390px,42vw);max-height:480px;overflow:auto;background:var(--paper);border-top:2px solid var(--blue);border-bottom:1px solid var(--line);box-shadow:none}
.entity-search-results[hidden]{display:none}
.search-result{display:block;width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:12px 12px 11px;text-align:left;color:var(--ink);cursor:pointer}
.search-result:hover,.search-result.active{background:var(--paper2)}
.search-result-title{display:block;font:500 14px/1.18 var(--sans)}
.search-result-meta{display:block;margin-top:3px;color:var(--warm);font:500 7px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.search-result-route{display:block;margin-top:4px;color:var(--orange);font:500 6.5px/1.25 var(--mono);letter-spacing:.06em}
.search-empty{padding:14px;color:var(--warm);font:500 8px/1.3 var(--mono);letter-spacing:.06em}

.drawer{width:440px;max-width:calc(100% - 36px);height:auto;min-height:280px;max-height:min(640px,calc(100% - 36px));padding:0;overflow:hidden;display:none}
.drawer.open{display:flex;flex-direction:column}
.drawer.company-safe{width:410px;top:18px;bottom:auto;max-height:min(640px,calc(100% - 36px));height:auto;overflow:hidden}
.drawer button.close{z-index:3;right:15px;top:14px}
.card-shell{display:flex;flex-direction:column;min-height:0;max-height:inherit;height:100%}
.card-head{flex:0 0 auto;padding:24px 22px 15px;border-bottom:1px solid var(--line2)}
.card-head .selected-badge{margin-bottom:10px}
.card-head h2{font-size:25px;margin-bottom:7px}
.card-head .eyebrow{margin-bottom:8px}
.card-head .meta{margin:0;font-size:8px}
.card-tabs{display:flex;flex:0 0 auto;gap:16px;padding:11px 22px 10px;border-bottom:1px solid var(--line2);overflow-x:auto}
.card-tab{appearance:none;border:0;border-bottom:1px solid transparent;background:none;padding:3px 0;color:var(--warm);font:500 7px/1 var(--mono);letter-spacing:.055em;white-space:nowrap;cursor:pointer}
.card-tab.active{color:var(--blue);border-color:var(--blue)}
.card-tab .count{color:var(--orange);margin-left:3px}
.card-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:17px 22px 22px;scrollbar-width:thin}
.card-block{padding:0 0 15px;margin:0 0 15px;border-bottom:1px solid var(--line2)}
.card-block:last-child{border-bottom:0;margin-bottom:0}
.card-key{margin-bottom:7px;color:var(--warm);font:500 7px/1.2 var(--mono);letter-spacing:.075em;text-transform:uppercase}
.card-copy{font:400 14px/1.48 var(--sans);color:var(--ink)}
.card-copy.lead{font-size:15px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.card-tag{border:1px solid var(--line);padding:4px 6px;font:500 6.5px/1 var(--mono);letter-spacing:.03em}
.relation{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:12px;line-height:1.3}
.relation:first-child{border-top:0}
.entity-link{appearance:none;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:500 12px/1.3 var(--sans);cursor:pointer}
.entity-link:hover{color:var(--blue)}
.relation-type{color:var(--warm);font:500 6.5px/1.25 var(--mono);letter-spacing:.045em;text-align:right}
.route-card{padding:12px 0;border-top:1px solid var(--line2)}
.route-card:first-child{border-top:0;padding-top:0}
.route-top{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.route-id{color:var(--orange);font:500 7px/1 var(--mono);letter-spacing:.06em}
.route-badge{border:1px solid var(--orange);padding:3px 5px;color:var(--orange);font:500 6px/1 var(--mono)}
.route-channel{color:var(--warm);font:500 6px/1.2 var(--mono);letter-spacing:.04em}
.route-path{font:500 11px/1.45 var(--sans);margin-bottom:6px}
.route-claim{font:400 11px/1.45 var(--sans);color:var(--warm)}
.route-focus{appearance:none;border:0;border-bottom:1px solid transparent;background:none;margin-top:7px;padding:2px 0;color:var(--blue);font:500 6.5px/1 var(--mono);letter-spacing:.06em;cursor:pointer}
.route-focus.active{border-color:var(--blue)}
.source-card{padding:10px 0;border-top:1px solid var(--line2)}
.source-card:first-child{border-top:0;padding-top:0}
.source-title{font:500 11px/1.4 var(--sans)}
.source-link{display:inline-block;margin-top:5px;color:var(--blue);font:500 6.5px/1.2 var(--mono);letter-spacing:.055em;text-decoration:none}
.source-status{display:inline-block;margin-left:8px;color:var(--orange);font:500 6px/1 var(--mono)}
.card-empty{color:var(--warm);font:400 12px/1.45 var(--sans)}

/* V17.8 — PUBLIC INTERACTION + ZOOM + FONT NORMALIZATION + COMPACT CARDS */

.modern-node.company.company-primary{
  opacity:1!important;
}
.modern-node.company.company-primary .dot{
  fill:var(--orange)!important;
  stroke:var(--orange)!important;
  opacity:1!important;
}
.modern-node.company.company-primary .mplate{
  fill:var(--paper)!important;
  stroke:var(--orange)!important;
  opacity:1!important;
}
.modern-node.company.company-primary .mname{
  fill:var(--ink)!important;
  opacity:1!important;
  font-weight:500!important;
}

/* SECONDARY = route closure, readable but neutral */
.hist-node.company-secondary,
.modern-node.company-secondary{
  opacity:.58!important;
}
.hist-node.company-secondary .dot,
.modern-node.company-secondary .dot{
  fill:var(--paper)!important;
  stroke:var(--muted)!important;
  opacity:.76!important;
}
.hist-node.company-secondary .surname,
.modern-node.company-secondary .mname{
  fill:var(--muted)!important;
  opacity:.76!important;
  font-weight:500!important;
}
.hist-node.company-secondary .label-plate,
.modern-node.company-secondary .mplate{
  opacity:0!important;
}

/* DIM = unrelated */
.hist-node.company-background,
.modern-node.company-background{
  opacity:.12!important;
}
.hist-node.company-background .dot,
.modern-node.company-background .dot{
  fill:var(--paper)!important;
  stroke:var(--muted)!important;
  opacity:.26!important;
}
.hist-node.company-background .surname,
.modern-node.company-background .mname{
  fill:var(--muted)!important;
  opacity:.22!important;
  font-weight:400!important;
}
.hist-node.company-background .label-plate,
.modern-node.company-background .mplate{
  opacity:0!important;
}

.modern-edge.company-edge-primary{
  opacity:.64!important;
}
.modern-edge.company-edge-background{
  opacity:.045!important;
}

/* Never allow secondary/background company-route nodes to inherit orange */
.hist-node.company-secondary.selected .dot,
.hist-node.company-secondary.route-active .dot,
.hist-node.company-secondary.node-route-hover .dot,
.modern-node.company-secondary.selected .dot,
.modern-node.company-secondary.route-active .dot,
.modern-node.company-secondary.node-route-hover .dot,
.hist-node.company-background.selected .dot,
.hist-node.company-background.route-active .dot,
.modern-node.company-background.selected .dot,
.modern-node.company-background.route-active .dot{
  fill:var(--paper)!important;
  stroke:var(--muted)!important;
}

/* STEP 1 — internal filters overlay the map without resizing its viewport. */
.subnav-wrap,.thirdnav-wrap{
  position:absolute;
  left:0;
  right:0;
  background:var(--paper);
}
.subnav-wrap{top:calc(100% - 1px);z-index:12}
.thirdnav-wrap{top:calc(100% + 27px);z-index:11}
/* Final cascade owner: the shared Research protocol is neutral / blue preview / green pinned. */
.hist-edge.route-active,.modern-edge.active{stroke:var(--blue)!important;stroke-width:2.2!important;stroke-opacity:.94!important}
.hist-edge.hover-active,.modern-edge.hover-active{stroke:#064CFF!important;stroke-width:1.3!important;stroke-opacity:.82!important}
.edge-label-group.active .edge-label-bg{stroke:var(--blue)!important;stroke-width:1.5!important}
.edge-label-group.hover-active .edge-label-bg{stroke:#064CFF!important;stroke-width:1.3!important}
.edge-label-group.hover-active text,.modern-label.hover-active,.historical-label.hover-active{fill:#064CFF!important}
.hist-node.selected .dot,.modern-node.selected .dot,.hist-node.route-active .dot,.modern-node.route-active .dot{fill:var(--blue)!important;stroke:var(--blue)!important;stroke-width:1.55!important}
.hist-node.selected .label-plate,.modern-node.selected .mplate,.hist-node.route-active .label-plate,.modern-node.route-active .mplate{fill:var(--blue)!important;stroke:var(--blue)!important;stroke-width:1.5!important}
.hist-node.selected .surname,.hist-node.selected .years,.modern-node.selected .mname,.modern-node.selected .mtype,.modern-node.selected .mstats{fill:var(--paper)!important}
.hist-node.hover-focus .dot,.hist-node.node-route-hover .dot,.modern-node.hover-route .dot,.modern-node.company-hover-focus .dot,.modern-node.node-route-hover .dot{stroke:#064CFF!important;stroke-width:1.3!important}

.hist-node.hover-focus .surname,.hist-node.hover-focus .years,.hist-node.node-route-hover .surname,.hist-node.node-route-hover .years,.modern-node.hover-route .mname,.modern-node.hover-route .mtype,.modern-node.company-hover-focus .mname,.modern-node.company-hover-focus .mtype,.modern-node.node-route-hover .mname,.modern-node.node-route-hover .mtype{fill:#064CFF!important}
.hist-node:focus-visible .dot,.modern-node:focus-visible .dot{stroke:var(--blue)!important;stroke-width:2!important}

.hist-node.selected:focus-visible .dot,.modern-node.selected:focus-visible .dot{fill:var(--blue)!important;stroke:var(--ink)!important;stroke-width:3!important}
/* Calibration pass: state contrast is shared with the other Research instruments.
   Tier shapes and sizes remain factual hierarchy, while the interaction overlay is uniform. */
.hist-edge,.modern-edge{transition:opacity 160ms ease,stroke 160ms ease,stroke-opacity 160ms ease,stroke-width 220ms ease!important}
.hist-node,.modern-node,.edge-label-group,.modern-label,.historical-label{transition:opacity 160ms ease,fill 160ms ease,stroke 160ms ease,stroke-width 220ms ease,color 160ms ease!important}
.stage:has(.hist-node.hover-focus,.hist-node.node-route-hover,.modern-node.hover-route,.modern-node.company-hover-focus,.modern-node.node-route-hover) .hist-node.dim,
.stage:has(.hist-node.hover-focus,.hist-node.node-route-hover,.modern-node.hover-route,.modern-node.company-hover-focus,.modern-node.node-route-hover) .modern-node.dim{opacity:.5!important}
.stage:has(.hist-node.hover-focus,.hist-node.node-route-hover,.modern-node.hover-route,.modern-node.company-hover-focus,.modern-node.node-route-hover) .hist-edge.dim,
.stage:has(.hist-node.hover-focus,.hist-node.node-route-hover,.modern-node.hover-route,.modern-node.company-hover-focus,.modern-node.node-route-hover) .modern-edge.dim{opacity:.5!important}
.stage:has(.hist-node.selected,.modern-node.selected) .hist-node.dim,
.stage:has(.hist-node.selected,.modern-node.selected) .modern-node.dim{opacity:.32!important}
.stage:has(.hist-node.selected,.modern-node.selected) .hist-edge.dim,
.stage:has(.hist-node.selected,.modern-node.selected) .modern-edge.dim{opacity:.32!important}
@media (prefers-reduced-motion:reduce){.hist-edge,.modern-edge,.hist-node,.modern-node,.edge-label-group,.modern-label,.historical-label{transition:none!important}}

 paint-order:stroke fill;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round

function cubicPath(start,control1,control2,end){

function horizontalFlowBezier(
 start,
 end,
 {minHandle=28,maxHandle=320,ratio=.42,verticalLoop=56}={}
){
 const dx=end[0]-start[0],dy=end[1]-start[1];

 // Same-column route segments use an S-loop. Their entry and exit
 // tangents still point right, matching adjacent left-to-right segments.
 if(Math.abs(dx)<1){
  const loop=Math.max(
   30,
   Math.min(90,Math.abs(dy)*.42||verticalLoop)
  );
  const control1=[start[0]+loop,start[1]];
  const control2=[end[0]-loop,end[1]];
  return cubicPath(start,control1,control2,end);
 }

 const direction=Math.sign(dx)||1;
 const handle=Math.max(
  minHandle,
  Math.min(maxHandle,Math.abs(dx)*ratio)
 );
 const control1=[
  start[0]+direction*handle,
  start[1]
 ];
 const control2=[
  end[0]-direction*handle,
  end[1]
 ];
 return cubicPath(start,control1,control2,end);
}
function softHistoricalBezier(
 start,
 end,
 key,
 scale=.055,
 minOffset=10,
 maxOffset=38
){
 const dx=end[0]-start[0],dy=end[1]-start[1];
 const length=Math.hypot(dx,dy)||1;

 // Most historical relations receive the same rounded horizontal-entry
 // language without being converted into modern route paths.
 if(Math.abs(dx)>=44){
  return horizontalFlowBezier(
   start,
   end,
   {minHandle:24,maxHandle:180,ratio:.34,verticalLoop:44}
  );
 }

 // Very short / nearly vertical historical relations retain a compact bow.
 const normalX=-dy/length,normalY=dx/length;
 const amplitude=curveSign(key)*Math.max(
  minOffset,
  Math.min(maxOffset,length*scale)
 );
 const control1=[
  start[0]+dx*.32+normalX*amplitude,
  start[1]+dy*.32+normalY*amplitude
 ];
 const control2=[
  start[0]+dx*.70+normalX*amplitude,
  start[1]+dy*.70+normalY*amplitude
 ];
 return cubicPath(start,control1,control2,end);
}

function resolveModernNodeLabelCollisions(){
 resetModernLabelOffsets();
 const nodes=[...document.querySelectorAll('.modern-node.technology,.modern-node.middle-context')];

 const sorted=nodes.sort((a,b)=>{
  const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
  return ar.top-br.top||ar.left-br.left;
 });

 const placed=[];
 const nudges=[0,-9,9,-16,16,-23,23,-30,30,-38,38];

 sorted.forEach(node=>{
  let best={dy:0,score:Infinity};
  for(const dy of nudges){
   const prior=Number(node.dataset.labelNudge||0);
   if(prior!==0)nudgeModernNodeLabel(node,-prior);
   if(dy!==0)nudgeModernNodeLabel(node,dy);

   const box=node.getBoundingClientRect();
   let score=0;
   placed.forEach(other=>{
    if(screenBoxesOverlap(box,other,3))score+=10;
   });

   // Avoid company plates.
   document.querySelectorAll('.modern-node.company').forEach(company=>{
    if(screenBoxesOverlap(box,company.getBoundingClientRect(),5))score+=30;
   });

   if(score<best.score){
    best={dy,score};
    if(score===0)break;
   }
  }

  const prior=Number(node.dataset.labelNudge||0);
  if(prior!==0)nudgeModernNodeLabel(node,-prior);
  if(best.dy!==0)nudgeModernNodeLabel(node,best.dy);

  placed.push(node.getBoundingClientRect());
 });
}

function mapViewportBox(){

function responsiveHomeView(){
 const box=mapViewportBox();
 const content=RESPONSIVE_HOME_BASE;
 const margin=RESPONSIVE_HOME_MARGIN;

 let x=content.x-margin.left;
 let y=content.y-margin.top;
 let w=content.w+margin.left+margin.right;
 let h=content.h+margin.top+margin.bottom;

 const viewportAspect=box.width/box.height;
 const contentAspect=w/h;

 if(viewportAspect>contentAspect){
  const targetW=h*viewportAspect;
  const extra=targetW-w;
  x-=extra/2;
  w=targetW;
 }else{
  const targetH=w/viewportAspect;
  const extra=targetH-h;
  y-=extra/2;
  h=targetH;
 }

 return{x,y,w,h};
}

function clampView(view){
 const home=window.VIEW_HOME_RUNTIME||VIEW_HOME;
 const ratio=home.h/home.w;

 if(view.w>=home.w)return{...home};

 view.w=Math.max(VIEW_LIMITS.minW,Math.min(home.w,view.w));
 view.h=view.w*ratio;

 const safe=4;
 const minX=CONTENT_BOUNDS.x-safe;
 const maxX=CONTENT_BOUNDS.x+CONTENT_BOUNDS.w+safe-view.w;
 const minY=CONTENT_BOUNDS.y-safe;
 const maxY=CONTENT_BOUNDS.y+CONTENT_BOUNDS.h+safe-view.h;

 if(maxX<minX){
  view.x=CONTENT_BOUNDS.x+(CONTENT_BOUNDS.w-view.w)/2;
 }else{
  view.x=Math.max(minX,Math.min(maxX,view.x));
 }
 if(maxY<minY){
  view.y=CONTENT_BOUNDS.y+(CONTENT_BOUNDS.h-view.h)/2;
 }else{
  view.y=Math.max(minY,Math.min(maxY,view.y));
 }

}

 let next={
  x:cursorGraphX-rx*targetW,

 });
 Object.entries(MODERN_POS).forEach(([id,xy])=>{

function routeClosure(rt,rids){
 const routes=new Set(rids),entities=new Set(),histEdges=new Set();
 rids.forEach(rid=>{
  const route=rt.routeMeta[rid]||{};
  (rt.segmentsByRoute[rid]||[]).forEach(s=>{
   entities.add(s.source_entity_id);entities.add(s.target_entity_id);
   if(s.base_edge_id && route.public_visibility!=='CONTEXT_ONLY')histEdges.add(s.base_edge_id);
  })
 });
 return{routes,entities,histEdges};
}

  );
 });

function peopleSemanticState(rt,period){
 const primary=new Set(
  Object.entries(PERSON_PERIOD)
   .filter(([,value])=>value===period)
   .map(([id])=>id)
 );

 const secondary=new Set();
 const activeEdges=new Set();

 rt.historical.edges.forEach(edge=>{
  const sourcePrimary=primary.has(edge.source_id);
  const targetPrimary=primary.has(edge.target_id);

  if(sourcePrimary||targetPrimary){
   activeEdges.add(edge.edge_id);
   if(!sourcePrimary)secondary.add(edge.source_id);
   if(!targetPrimary)secondary.add(edge.target_id);
  }
 });

 /* Primary always wins over secondary. */
 primary.forEach(id=>secondary.delete(id));

 return{primary,secondary,activeEdges};
}


function clearTechnologySemanticState(){
 document.querySelectorAll('.hist-node,.modern-node').forEach(n=>{
  n.classList.remove(
   'tech-primary',

  );
 });
 document.querySelectorAll('.modern-edge').forEach(e=>{
  e.classList.remove(
   'tech-edge-primary',
   'tech-edge-background'
  );
 });
}

function technologySemanticState(rt,techIds){
 const primary=new Set(techIds);
 const routeIds=[...new Set([...primary].flatMap(id=>routeIdsFor(rt,id)))];
 const secondary=new Set();
 const activeEdges=new Set();

 routeIds.forEach(rid=>{
  (rt.routeNodeSets[rid]||new Set()).forEach(id=>{
   if(!primary.has(id))secondary.add(id);
  });
  (rt.segmentsByRoute[rid]||[]).forEach(seg=>{
   activeEdges.add(`${seg.route_id}::${seg.sequence}`);
  });
 });

 primary.forEach(id=>secondary.delete(id));

 return{primary,secondary,routeIds,activeEdges};
}

function companySemanticState(rt,companyId){
 const primary=new Set(companyId?[companyId]:[]);
 const routeIds=companyId ? canonicalCompanyRouteIds(rt,companyId) : [];
 const secondary=new Set();

 routeIds.forEach(rid=>{
  (rt.routeNodeSets[rid]||new Set()).forEach(id=>{
   if(!primary.has(id))secondary.add(id);
  });
 });

 return{primary,secondary,routeIds};
}

function applyView(rt){
 resetClasses();
 clearPeopleSemanticState();
 clearTechnologySemanticState();

 if(SELECTED_ID){

 }

 if(ACTIVE_MODE==='MAP')return;

 if(ACTIVE_MODE==='PEOPLE'){

 if(ACTIVE_MODE==='COMPANY'){

}

let DRAWER_POSITION_TIMER=null;
let DRAWER_POSITION_RUNTIME=null;

function scheduleDrawerContainment(delay=0){
 clearTimeout(DRAWER_POSITION_TIMER);
 const drawer=document.getElementById('drawer');
 if(!DRAWER_POSITION_RUNTIME||!SELECTED_ID||!drawer?.classList.contains('open'))return;
 DRAWER_POSITION_TIMER=setTimeout(()=>positionDrawerForEntity(DRAWER_POSITION_RUNTIME,SELECTED_ID),delay);
}

function applyDrawerAwareHomeFit(force=false){
 scheduleDrawerContainment();
}

function positionDrawerForEntity(rt,id){
 RI_INSPECTOR.position(rt,id);
}

function ensureEntityVisible(id){
 if(window.self!==window.top)return;
 const map=document.getElementById('map');
 const stage=document.getElementById('stage');
 const anchor=document.querySelector(`.hist-node[data-id="${id}"],.modern-node[data-id="${id}"]`);
 if(!map||!stage||!anchor)return;
 const mapRect=map.getBoundingClientRect();
 const stageRect=stage.getBoundingClientRect();
 const anchorRect=anchor.getBoundingClientRect();
 const safe=42;
 const bounds={left:stageRect.left+safe,right:stageRect.right-safe,top:stageRect.top+safe,bottom:stageRect.bottom-safe};
 let dx=0,dy=0;
 if(anchorRect.left<bounds.left)dx=anchorRect.left-bounds.left;
 else if(anchorRect.right>bounds.right)dx=anchorRect.right-bounds.right;
 if(anchorRect.top<bounds.top)dy=anchorRect.top-bounds.top;
 else if(anchorRect.bottom>bounds.bottom)dy=anchorRect.bottom-bounds.bottom;
 if(!dx&&!dy)return;
 setMapView(clampView({
  x:CURRENT_VIEW.x+dx*CURRENT_VIEW.w/mapRect.width,
  y:CURRENT_VIEW.y+dy*CURRENT_VIEW.h/mapRect.height,
  w:CURRENT_VIEW.w,
  h:CURRENT_VIEW.h
 }));
}

function selectEntity(rt,id,options={}){
 // A selected entity remains pinned until an explicit close, Escape,
 // map-background click, or a different entity replaces it.
 if(SELECTED_ID===id&&!options.ensureVisible)return;
 clearPersonHover(rt);
 SELECTED_ID=id;CARD_ENTITY_ID=id;CARD_TAB='OVERVIEW';CARD_ROUTE_FOCUS=null;applyView(rt);
 if(window.RI_MOBILE_GRAPH?.active)RI_MOBILE_GRAPH.reveal(id);
 else if(options.ensureVisible)ensureEntityVisible(id);
 renderCard(rt);
 const drawer=document.getElementById('drawer');
 DRAWER_POSITION_RUNTIME=rt;drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');
 positionDrawerForEntity(rt,id);applyDrawerAwareHomeFit(false);
 setTimeout(()=>{positionDrawerForEntity(rt,id);resolveVisibleEdgeLabelCollisions()},240);
}

function buildSubnav(rt){
 const wrap=document.getElementById('subnavWrap'),
       sub=document.getElementById('subnav'),
       thirdWrap=document.getElementById('thirdnavWrap'),
       third=document.getElementById('thirdnav');

 sub.innerHTML='';
 third.innerHTML='';
 thirdWrap.classList.remove('open');

 if(ACTIVE_MODE==='MAP'){
  wrap.classList.remove('open');
  HOVER_TECH_CATEGORY=null;
  return;
 }

 wrap.classList.add('open');
 let items=[];

 if(ACTIVE_MODE==='PEOPLE'){
  items=PEOPLE_FILTERS.map(x=>({id:x,label:x}));
 }

 if(ACTIVE_MODE==='TECH'){
  items=TECH_CATEGORIES.map(x=>({id:x,label:x}));
 }

 if(ACTIVE_MODE==='COMPANY'){
  items=[
   {id:'ВСЕ',label:'ВСЕ'},
   ...P0.companies.map(c=>({id:c.entity_id,label:c.title}))
  ];
 }

 sub.innerHTML=items.map(x=>
  `<button data-filter="${esc(x.id)}" class="${ACTIVE_FILTER===x.id||ACTIVE_TECH_CATEGORY===x.id?'active':''}">${esc(x.label)}</button>`
 ).join('');

 sub.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
   SELECTED_ID=null;
   closeDrawer();

   if(ACTIVE_MODE==='TECH'){
    const value=b.dataset.filter;
    HOVER_TECH_CATEGORY=null;
    cancelTechMenuHide();

    if(value==='ВСЕ'){
     ACTIVE_FILTER='ВСЕ';
     ACTIVE_TECH_CATEGORY=null;
    }else{
     ACTIVE_FILTER=value;
     ACTIVE_TECH_CATEGORY=value;
    }
   }else{
    ACTIVE_FILTER=b.dataset.filter;
   }

   buildSubnav(rt);
   applyView(rt);
   if(ACTIVE_MODE==='COMPANY')window.RI_MOBILE_GRAPH?.reveal(ACTIVE_FILTER);
   updateState();
  };

  if(ACTIVE_MODE==='TECH'){
   const value=b.dataset.filter;
   if(value!=='ВСЕ' && P0.menu.technology_categories.includes(value)){
    b.addEventListener('mouseenter',()=>{
     cancelTechMenuHide();
     HOVER_TECH_CATEGORY=value;
     buildSubnav(rt);
    });
    b.addEventListener('mouseleave',()=>{
     scheduleTechMenuHide(rt);
    });
   }
  }
 });

 const previewCategory=
  ACTIVE_MODE==='TECH'
   ?activeTechMenuCategory()
   :null;

 if(
  previewCategory &&
  P0.menu.technology_categories.includes(previewCategory)
 ){
  const techs=P0.technologies.filter(t=>t.menu_category===previewCategory);

  thirdWrap.classList.add('open');
  third.dataset.previewCategory=previewCategory;

  third.innerHTML=techs.map(t=>
   `<button data-tech="${t.entity_id}" class="${ACTIVE_FILTER===t.entity_id?'active':''}">${esc(t.title)}</button>`
  ).join('');

  thirdWrap.onmouseenter=()=>{
   cancelTechMenuHide();
  };
  thirdWrap.onmouseleave=()=>{
   scheduleTechMenuHide(rt);
  };

  third.querySelectorAll('button').forEach(b=>{
   b.onclick=()=>{
    SELECTED_ID=null;
    closeDrawer();
    cancelTechMenuHide();

    const selectedId=b.dataset.tech;
    const entity=P0.technologies.find(t=>t.entity_id===selectedId);

    ACTIVE_FILTER=selectedId;
    ACTIVE_TECH_CATEGORY=entity?.menu_category||previewCategory;
    HOVER_TECH_CATEGORY=null;

    applyView(rt);
    buildSubnav(rt);
    updateState();
   };
  });
 }else{
  thirdWrap.onmouseenter=null;
  thirdWrap.onmouseleave=null;
  delete third.dataset.previewCategory;
 }
}

function setMode(rt,mode){
 ACTIVE_MODE=mode;
 SELECTED_ID=null;
 HOVER_TECH_CATEGORY=null;
 cancelTechMenuHide();
 closeDrawer();

 document.querySelectorAll('.nav button').forEach(b=>
  b.classList.toggle('active',b.dataset.mode===mode)
 );

 ACTIVE_FILTER=mode==='MAP'?null:'ВСЕ';
 ACTIVE_TECH_CATEGORY=null;

 buildSubnav(rt);
 applyView(rt);
 updateState();
}
function updateState(){
 const label=
  ACTIVE_MODE==='MAP'?'КАРТА':
  ACTIVE_MODE==='PEOPLE'?'ЛЮДИ':
  ACTIVE_MODE==='TECH'?'ТЕХНОЛОГИИ':
  'КОМПАНИИ';

 let f=ACTIVE_FILTER||'ВСЁ';
 if(ACTIVE_MODE==='TECH'&&isTechnologyId(ACTIVE_FILTER)){
  const entity=P0.technologies.find(t=>t.entity_id===ACTIVE_FILTER);
  f=entity?entity.title:ACTIVE_FILTER;
 }
 document.getElementById('viewState').textContent=`${label} · ${f}`;
}

function exitStandaloneMap(){
 if(document.fullscreenElement){
  document.exitFullscreen?.();
  return;
 }
 if(window.opener&&!window.opener.closed){
  window.close();
  setTimeout(()=>{window.location.href='/research/russian-intellect/'},120);
  return;
 }
 if(window.history.length>1){
  window.history.back();
  return;
 }
 window.location.href='/research/russian-intellect/';
}

function setupKeyboardDismissal(){
 document.addEventListener('keydown',event=>{
  if(event.key!=='Escape'||event.defaultPrevented)return;
  const drawer=document.getElementById('drawer');
  const searchResults=document.getElementById('entitySearchResults');
  if(drawer.classList.contains('open')&&window.RI_RUNTIME){
   event.preventDefault();
   clearSelection(window.RI_RUNTIME);
   return;
  }
  if(!searchResults.hidden){
   event.preventDefault();
   hideEntitySearch(true);
   return;
  }
  if(window.self===window.top){
   event.preventDefault();
   exitStandaloneMap();
  }
 });
}

function setupStandaloneExit(){
 const standalone=window.self===window.top;
 const button=document.getElementById('standaloneExitBtn');
 document.documentElement.classList.toggle('is-standalone',standalone);
 if(!standalone)return;
 button.addEventListener('click',exitStandaloneMap);
}

async function boot(){
 const badge=document.getElementById('runtimeBadge'),err=document.getElementById('error');
 try{
  const frozen=JSON.parse(document.getElementById('historical-snapshot').textContent);
  const rawPeople=frozen.people,rawEdges=frozen.edges,rawContext=frozen.institutionalContext;
  const rawCards=frozen.personCards,rawTags=frozen.personTags;
  riPatchModern(P0.route_segments);
  const rt=buildRuntime(patchHistorical(rawPeople,rawEdges,rawContext),patchPersonCards(rawCards),rawTags),result=qa(rt);window.RI_RUNTIME=rt;window.RI_QA=result;
  riAssertProvenance(rt);
  if(!result.pass)throw new Error('V18.0D.2 CRITICAL QA FAIL\n'+JSON.stringify(result.checks,null,2));
  addHistorical(rt);addModern(rt);alignCompanyCardsLeft();
  requestAnimationFrame(()=>{
   normalizeCompanyCardWidths();
   alignCompanyCardsLeft();
   scheduleFinalLabelCollisionPass();
  });
  const allConnectionPaths=[...document.querySelectorAll('.hist-edge,.modern-edge')];
  if(!allConnectionPaths.every(path=>/\sC/.test(path.getAttribute('d')||'')))throw new Error('Non-Bezier connection detected');
  const companyYs=P0.companies.map(c=>MODERN_POS[c.entity_id][1]).sort((a,b)=>a-b),companyGaps=companyYs.slice(1).map((y,i)=>y-companyYs[i]);
  if(!companyGaps.every(g=>Math.abs(g-111.428571)<.02))throw new Error('Company vertical distribution is not uniform');
  const renderedModern=document.querySelectorAll('.modern-edge').length,expected=P0.route_segments.filter(s=>s.relation_type!=='BASE_EDGE_REF').length;
  window.RI_RENDER_QA={renderedModern,expected,match:renderedModern===expected};
  badge.textContent=`81 / 74 / 6 · 28 / 8 / 36`;badge.classList.add('pass');
  document.getElementById('counts').textContent=`81 PEOPLE CARDS · 8 TECH CARDS · 8 COMPANY CARDS · 16 ROUTES`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setMode(rt,b.dataset.mode));
  document.querySelector('.drawer .close').onclick=()=>clearSelection(rt);
  document.getElementById('drawer').addEventListener('click',event=>{
   const tab=event.target.closest('[data-card-tab]');if(tab){CARD_TAB=tab.dataset.cardTab;renderCard(rt);scheduleDrawerContainment();return}
   const entity=event.target.closest('[data-entity-link]');if(entity){selectEntity(rt,entity.dataset.entityLink);return}
   const route=event.target.closest('[data-route-focus]');if(route){CARD_ROUTE_FOCUS=route.dataset.routeFocus;applyRoutes(rt,[CARD_ROUTE_FOCUS],new Set([CARD_ENTITY_ID]));renderCard(rt);scheduleDrawerContainment();return}
  });
  setupSearch(rt);
  setupMapNavigation(rt);
  document.getElementById('map').onclick=()=>{
   if(SUPPRESS_MAP_CLICK){SUPPRESS_MAP_CLICK=false;return}
   clearSelection(rt)
  };
  buildSubnav(rt);applyView(rt);updateState();
 }catch(e){console.error(e);badge.textContent='INTERFACE · ERROR';badge.classList.add('fail');err.textContent=String(e.stack||e);err.classList.add('open')}
}
setupStandaloneExit();
setupKeyboardDismissal();
boot();

let RESPONSIVE_HOME_TIMER=null;
window.addEventListener('resize',()=>{
 clearTimeout(RESPONSIVE_HOME_TIMER);
 RESPONSIVE_HOME_TIMER=setTimeout(()=>{applyResponsiveHomeView(false);scheduleDrawerContainment()},90);
});

if(window.ResizeObserver){
 const responsiveHomeObserver=new ResizeObserver(()=>{
 clearTimeout(RESPONSIVE_HOME_TIMER);
  RESPONSIVE_HOME_TIMER=setTimeout(()=>{applyResponsiveHomeView(false);scheduleDrawerContainment()},70);
 });
 const observedStage=document.querySelector('.stage');
 if(observedStage)responsiveHomeObserver.observe(observedStage);
}

requestAnimationFrame(()=>{
 window.VIEW_HOME_RUNTIME=responsiveHomeView();
 applyResponsiveHomeView(true);
});

</script>
