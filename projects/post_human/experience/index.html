2018 · LocoOne
Видеодизайн для модного показа.

Действие проекта происходит после антропогенной катастрофы. Глобальная цивилизация распалась. Началась эпоха новых тёмных веков.

Города, технологии и культурные символы сохранились фрагментами. Они становятся материалом для новых мифов, ритуалов и способов выживания.

Идея и видеодизайн — Julia Chernysheva.
3D-анимация — Alexey Gladkov.</p><h3>Материалы</h3><ul><li><a style="color:inherit" href="assets/2.png">Матрица</a></li><li><a style="color:inherit" href="assets/5.jpg">Публичный показ</a></li><li><a style="color:inherit" href="assets/6.jpg">Пространство показа</a></li><li><a style="color:inherit" href="assets/3.jpg">Модель</a></li><li><a style="color:inherit" href="assets/7.jpg">Презентация</a></li><li><a style="color:inherit" href="assets/1.png">Красный сигнал</a></li><li><a style="color:inherit" href="https://www.youtube.com/watch?v=fPJahglyHqA">Фильм 01</a></li><li><a style="color:inherit" href="https://www.youtube.com/watch?v=1ANnwDbR4MQ">Фильм 02</a></li></ul></section></noscript><script src="scene.js"></script></body></html>
